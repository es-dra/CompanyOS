[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "companyos-runtime"
version = "0.2.0.dev1"
description = "Durable, policy-enforced runtime kernel for CompanyOS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["jsonschema>=4.18"]

[project.scripts]
companyos-runtime = "companyos_runtime.cli:main"

[tool.setuptools.packages.find]
include = ["companyos_runtime*"]
